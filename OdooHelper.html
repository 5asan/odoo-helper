<meta charset="utf-8">

<title>Odoo Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #dfe3e8;
  --text: #1d2330;
  --muted: #5f6b7a;
  --brand: #714b67;           /* Odoo-like plum */
  --brand-ink: #ffffff;
  --brand-soft: #f3ecf1;
  --ok: #1f7a4d;
  --ok-soft: #e5f4ec;
  --warn: #9a5b00;
  --warn-soft: #fdf1dd;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --surface: #1c1f26; --surface-2: #242833; --border: #323846;
    --text: #e7eaf0; --muted: #9aa4b2; --brand: #c79bbd; --brand-ink: #1b1320; --brand-soft: #2e2330;
    --ok: #5cc993; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #f2867c; --bad-soft: #3d1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1c1f26; --surface-2: #242833; --border: #323846;
  --text: #e7eaf0; --muted: #9aa4b2; --brand: #c79bbd; --brand-ink: #1b1320; --brand-soft: #2e2330;
  --ok: #5cc993; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #f2867c; --bad-soft: #3d1d1a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.5;
}
a { color: var(--brand); }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-size: 13px; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.company-pick { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.company-pick select { min-width: 160px; }

/* Layout */
.layout { display: flex; min-height: calc(100vh - 57px); }
.nav { width: 230px; flex-shrink: 0; padding: 14px 10px; border-inline-end: 1px solid var(--border); background: var(--surface); }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; margin-bottom: 2px;
}
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav .sep { height: 1px; background: var(--border); margin: 10px 6px; }
.main { flex: 1; min-width: 0; padding: 22px; max-width: 1200px; }

@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .nav { width: auto; display: flex; overflow-x: auto; padding: 8px 16px; border-inline-end: 0; border-bottom: 1px solid var(--border); }
  .nav a { white-space: nowrap; margin: 0 2px 0 0; }
  .nav .sep { display: none; }
  .main { padding: 16px; }
  .company-pick span { display: none; }
}

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.page-head { margin-bottom: 18px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.feature { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text); }
.feature:hover { border-color: var(--brand); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
.stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* Badges */
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.soon { background: var(--surface-2); color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }

/* Notices */
.notice { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--brand-soft); color: var(--text); }

/* Forms */
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink);
  padding: 7px 14px; border-radius: 8px; font: inherit; font-weight: 600;
}
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field select, .field input { color: var(--text); font-size: 13px; }
.spacer { flex: 1; }

/* Drop zone */
.drop {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center;
  background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop b { display: block; font-size: 15px; margin-bottom: 4px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer;
  font: inherit; color: var(--muted); white-space: nowrap;
}
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

/* Tables */
.table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 9px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; z-index: 1; white-space: nowrap; }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.mismatch td { background: var(--warn-soft); }
td input { width: 100%; min-width: 80px; padding: 4px 6px; border-color: transparent; background: transparent; }
td input:hover { border-color: var(--border); }
td input.num { text-align: end; font-variant-numeric: tabular-nums; direction: ltr; }
[dir="rtl"] td input.num { text-align: left; }
.stat b, td.num { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .stat b { text-align: right; }
td.date-cell input { min-width: 110px; }
td.label-cell input { min-width: 260px; }
td.partner-cell input { min-width: 180px; }
.icon-btn { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px 6px; }
.icon-btn:hover { color: var(--bad); }
.pos { color: var(--ok); }
.neg { color: var(--bad); }

details.card > summary { cursor: pointer; font-weight: 600; }
details.card[open] > summary { margin-bottom: 12px; }

.toast {
  position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw;
}
[dir="rtl"] .toast { transform: translateX(50%); }
.toast.show { opacity: 1; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(10, 12, 16, .45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; width: min(420px, 100%); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }

</style>

<script>
/* Tiny key-value store on IndexedDB (falls back to memory if blocked). */
const Store = (() => {
  let dbPromise = null;
  const mem = new Map();
  let memOnly = false;

  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve) => {
        try {
          const req = indexedDB.open('odoo-helper', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => { memOnly = true; resolve(null); };
        } catch (e) { memOnly = true; resolve(null); }
      });
    }
    return dbPromise;
  }

  function tx(db, mode, fn) {
    return new Promise((resolve, reject) => {
      const store = db.transaction('kv', mode).objectStore('kv');
      const req = fn(store);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function get(key) {
    const db = await open();
    if (!db) return mem.get(key);
    try { return await tx(db, 'readonly', s => s.get(key)); } catch (e) { return mem.get(key); }
  }
  async function set(key, value) {
    mem.set(key, value);
    const db = await open();
    if (!db) return;
    try { await tx(db, 'readwrite', s => s.put(value, key)); } catch (e) { memOnly = true; }
  }
  async function del(key) {
    mem.delete(key);
    const db = await open();
    if (!db) return;
    try { await tx(db, 'readwrite', s => s.delete(key)); } catch (e) { /* ignore */ }
  }
  return { get, set, del, isMemoryOnly: () => memOnly };
})();

<script>
/* Shared helpers: escaping, numbers, dates, files, downloads. */
const U = (() => {
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* Arabic-Indic and Persian digits → ASCII */
  function digits(s) {
    return String(s)
      .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/٫/g, '.').replace(/٬/g, ',');
  }

  /* Parse an amount like "1,234.50", "1.234,50", "(500.00)", "500.00-", "500.00 CR".
     Returns {v, sfx} where sfx is 'C' / 'D' / null, or null if not a number. */
  function parseNum(input) {
    if (input == null) return null;
    if (typeof input === 'number') return isFinite(input) ? { v: input, sfx: null } : null;
    let s = digits(input).trim();
    if (!s || /[\/:]/.test(s)) return null;
    let neg = false, sfx = null;
    const m = s.match(/\s*(CR|DR|Cr|Dr|cr|dr)\.?$/);
    if (m) { sfx = m[1].toUpperCase()[0]; s = s.slice(0, m.index); }
    s = s.replace(/(SAR|AED|USD|EUR|GBP|KWD|QAR|BHD|OMR|EGP|JOD|IQD|ر\.س|د\.إ|ريال|درهم|دينار)/gi, '')
         .replace(/[\s$€£‎‏‪-‮]/g, '');
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    else if (s.startsWith('+')) s = s.slice(1);
    if (!/^[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
    const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if (lastDot >= 0 && lastComma >= 0) {
      s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lastComma >= 0) {
      const commas = (s.match(/,/g) || []).length;
      const decLen = s.length - lastComma - 1;
      s = (commas === 1 && decLen !== 3) ? s.replace(',', '.') : s.replace(/,/g, '');
    } else if ((s.match(/\./g) || []).length > 1) {
      s = s.replace(/\./g, '');
    }
    const v = parseFloat(s);
    if (isNaN(v)) return null;
    return { v: neg ? -v : v, sfx };
  }

  const MONTHS = {
    jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12,
    'يناير': 1, 'فبراير': 2, 'مارس': 3, 'أبريل': 4, 'ابريل': 4, 'إبريل': 4, 'مايو': 5, 'يونيو': 6, 'يوليو': 7,
    'أغسطس': 8, 'اغسطس': 8, 'سبتمبر': 9, 'أكتوبر': 10, 'اكتوبر': 10, 'نوفمبر': 11, 'ديسمبر': 12,
  };
  function monthFromName(n) {
    n = n.toLowerCase();
    if (MONTHS[n]) return MONTHS[n];
    return MONTHS[n.slice(0, 3)] || null;
  }
  function valid(y, m, d) {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCMonth() !== m - 1) return null;
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  /* Parse a date at the start of a string. order: 'DMY' or 'MDY'. Returns ISO 'YYYY-MM-DD' or null. */
  function parseDate(input, order = 'DMY') {
    if (input == null) return null;
    if (input instanceof Date && !isNaN(input)) return valid(input.getFullYear(), input.getMonth() + 1, input.getDate());
    const s = digits(input).trim();
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?!\d)/);
    if (m) return valid(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})(?!\d)/);
    if (m) {
      let a = +m[1], b = +m[2], y = +m[3];
      let d = order === 'MDY' ? b : a, mo = order === 'MDY' ? a : b;
      if (mo > 12 && d <= 12) { const tmp = d; d = mo; mo = tmp; }
      return valid(y, mo, d);
    }
    m = s.match(/^(\d{1,2})[\s\-\/.]*([A-Za-z؀-ۿ]{3,})\.?[\s\-\/.,]*(\d{4}|\d{2})(?!\d)/);
    if (m) { const mo = monthFromName(m[2]); if (mo) return valid(+m[3], mo, +m[1]); }
    m = s.match(/^([A-Za-z]{3,})\.?[\s\-]*(\d{1,2}),?[\s\-]*(\d{4})(?!\d)/);
    if (m) { const mo = monthFromName(m[1]); if (mo) return valid(+m[3], mo, +m[2]); }
    return null;
  }

  function fmtDate(iso, fmt) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    if (fmt === 'DD/MM/YYYY') return `${d}/${m}/${y}`;
    if (fmt === 'MM/DD/YYYY') return `${m}/${d}/${y}`;
    return iso;
  }

  function fmtMoney(v) {
    if (v == null || isNaN(v)) return '';
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  const round2 = v => Math.round(v * 100) / 100;

  /* Normalise text for matching: lowercase, no punctuation, unify Arabic letters. */
  function norm(s) {
    return digits(s || '').toLowerCase()
      .replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[ً-ْـ]/g, '')
      .replace(/[^a-z0-9؀-ۿ]+/g, ' ').trim();
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsArrayBuffer(file);
    });
  }

  /* Read an Excel/CSV file into an array of row arrays (strings). */
  async function readSheet(file) {
    const buf = await readFile(file);
    let wb;
    if (/\.csv$/i.test(file.name) || file.type === 'text/csv') {
      const text = new TextDecoder('utf-8').decode(buf).replace(/^﻿/, '');
      wb = XLSX.read(text, { type: 'string', raw: true });
    } else {
      wb = XLSX.read(buf, { type: 'array', cellDates: true });
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', dateNF: 'yyyy-mm-dd' })
      .map(r => r.map(c => (c == null ? '' : String(c).trim())));
  }

  /* Save a file. On the hosted (claude.ai) page this goes through the viewer's download
     permission; when opened as a local file it uses a normal browser download. */
  // Returns 'saved', 'declined', 'busy', or 'unavailable:<reason>' (caller then offers Copy instead).
  let lastPerms = null;   // set when the viewer turned downloads off, so the dialog can offer to switch it back on
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  async function download(name, data) {
    const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (hasClaude || inFrame) {
      let dl = null, code = hasClaude ? 'no_permission' : 'not_signed_in';
      if (hasClaude) { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
      if (hasClaude && !dl) {
        // Ask the viewer for the download permission if it is askable, then try again.
        try {
          const perms = await window.claude.use('permissions');
          let state = perms ? await perms.state('downloads') : 'unavailable';
          if (state === 'prompt') state = ((await perms.request(['downloads'])) || {}).downloads || state;
          if (state === 'granted') dl = await window.claude.use('downloads');
          code = 'downloads_' + state;
          if (!dl && state === 'denied') lastPerms = perms;
        } catch (e) { /* keep code */ }
      }
      if (dl) {
        try { await dl.save({ filename: name, data }); return 'saved'; }
        catch (e) {
          code = (e && e.code) || 'unavailable';
          if (code === 'declined') return 'declined';
          if (code === 'rate_limited') { toast(t('download_busy')); return 'busy'; }
        }
      }
      return 'unavailable:' + code;
    }
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return 'saved';
  }

  /* Fallback when a file can't be saved: show the content with a Copy button.
     Tab-separated text pastes straight into Excel cells. */
  function copyDialog({ message, text, reason }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" style="width:min(640px,100%)">
        <h2>${t('save_failed_title')}</h2>
        <p>${esc(message)}</p>
        <p class="muted small">${t('save_failed_reason')}: <code>${esc(reason || '')}</code></p>
        <textarea id="copyText" readonly dir="ltr" style="width:100%;height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-bottom:12px"></textarea>
        <div class="row end">
          ${lastPerms && reason === 'downloads_denied' ? `<button type="button" class="btn ghost" data-a="perm">${t('allow_downloads')}</button>` : ''}
          <button type="button" class="btn ghost" data-a="close">${t('close')}</button>
          <button type="button" class="btn" data-a="copy">${t('copy')}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const ta = wrap.querySelector('#copyText');
    ta.value = text;
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('[data-a="close"]').addEventListener('click', close);
    const perm = wrap.querySelector('[data-a="perm"]');
    if (perm) perm.addEventListener('click', async () => {
      try { await lastPerms.manage(); close(); toast(t('try_again')); } catch (e) { toast(t('perm_menu_hint')); }
    });
    wrap.querySelector('[data-a="copy"]').addEventListener('click', () => {
      const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); toast(t('copied')); } catch (e) { toast(t('copy_manual')); } };
      try {
        navigator.clipboard.writeText(text).then(() => toast(t('copied')), fallback);
      } catch (e) { fallback(); }
    });
  }

  const toTSV = aoa => aoa.map(r => r.map(c => String(c == null ? '' : c).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');

  function toCSV(aoa) {
    return '﻿' + aoa.map(r => r.map(c => {
      const s = c == null ? '' : String(c);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');
  }

  function downloadCSV(name, aoa) { return download(name, toCSV(aoa)); }

  function downloadXLSX(name, aoa, sheetName = 'Sheet1', widths) {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    return download(name, new Uint8Array(XLSX.write(wb, { type: 'array', bookType: 'xlsx' })));
  }

  /* In-page dialog (browser confirm/prompt are blocked on the hosted page).
     ask({message, input, okText, danger}) → resolves true / the typed text, or null if cancelled. */
  function ask({ message, input = null, okText, danger = false }) {
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'modal-wrap';
      wrap.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <p>${esc(message)}</p>
          ${input != null ? `<input id="askInput" value="${esc(input)}" style="width:100%;margin-bottom:12px">` : ''}
          <div class="row end">
            <button type="button" class="btn ghost" data-a="no">${t('cancel')}</button>
            <button type="button" class="btn ${danger ? 'danger' : ''}" data-a="yes">${esc(okText || t('ok'))}</button>
          </div>
        </div>`;
      document.body.appendChild(wrap);
      const inp = wrap.querySelector('#askInput');
      const done = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      const yes = () => done(inp ? (inp.value.trim() || null) : true);
      const onKey = e => { if (e.key === 'Escape') done(null); if (e.key === 'Enter') yes(); };
      document.addEventListener('keydown', onKey);
      wrap.addEventListener('click', e => { if (e.target === wrap) done(null); });
      wrap.querySelector('[data-a="no"]').addEventListener('click', () => done(null));
      wrap.querySelector('[data-a="yes"]').addEventListener('click', yes);
      (inp || wrap.querySelector('[data-a="yes"]')).focus();
      if (inp) inp.select();
    });
  }

  function safeName(s) { return String(s || 'file').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_'); }

  /* Wire a drop zone + hidden input; calls onFiles(FileList). */
  function dropZone(el, input, onFiles) {
    el.addEventListener('click', () => input.click());
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', () => { if (input.files.length) onFiles(input.files); input.value = ''; });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
    });
  }

  return { esc, toast, uid, digits, parseNum, parseDate, fmtDate, fmtMoney, round2, norm, readFile, readSheet,
    download, downloadCSV, downloadXLSX, safeName, dropZone, ask, copyDialog, toTSV };
})();

<script>
/* Master Data: Chart of Accounts, Contacts, Analytic Accounts (per company). */
const MasterData = (() => {
  const TYPES = {
    accounts: {
      tab: 'tab_accounts', how: 'how_accounts',
      fields: [
        { k: 'code', label: 'fld_code', req: true, re: /^(code|account code|الرمز|رمز|كود)/i },
        { k: 'name', label: 'fld_name', req: true, re: /(account name|^name$|^name\b|اسم الحساب|^الاسم|^اسم)/i },
        { k: 'type', label: 'fld_type', re: /(type|النوع|نوع)/i },
      ],
    },
    contacts: {
      tab: 'tab_contacts', how: 'how_contacts',
      fields: [
        { k: 'name', label: 'fld_name', req: true, re: /(display name|complete name|^name|^الاسم|^اسم)/i },
        { k: 'vat', label: 'fld_vat', re: /(tax id|vat|الرقم الضريبي|ضريب)/i },
        { k: 'ref', label: 'fld_ref', re: /(^reference|^ref\b|^internal ref|المرجع)/i },
        { k: 'email', label: 'fld_email', re: /(e-?mail|البريد)/i },
      ],
    },
    analytics: {
      tab: 'tab_analytics', how: 'how_analytics',
      fields: [
        { k: 'name', label: 'fld_name', req: true, re: /(^name|analytic account|^الاسم|^اسم)/i },
        { k: 'code', label: 'fld_ref', re: /(^reference|^ref\b|^code|المرجع|الرمز)/i },
        { k: 'plan', label: 'fld_plan', re: /(plan|الخطة|خطة)/i },
      ],
    },
  };

  let tab = 'accounts';
  let pending = null;   // { type, headers, rows, map }
  let query = '';

  function autoMap(type, headers) {
    const used = new Set();
    const map = {};
    for (const f of TYPES[type].fields) {
      const idx = headers.findIndex((h, i) => !used.has(i) && f.re.test(h.trim()));
      map[f.k] = idx;
      if (idx >= 0) used.add(idx);
    }
    // Fallbacks: if required fields are unmapped, use first unused columns.
    for (const f of TYPES[type].fields) {
      if (f.req && map[f.k] < 0) {
        const idx = headers.findIndex((h, i) => !used.has(i) && h);
        map[f.k] = idx; if (idx >= 0) used.add(idx);
      }
    }
    return map;
  }

  function render() {
    const co = App.company();
    const d = App.data;
    return `
      <div class="page-head">
        <h1>${t('master_title')}</h1>
        <p class="muted">${U.esc(t('master_sub', { name: co.name }))}</p>
      </div>
      <div class="tabs" role="tablist">
        ${Object.keys(TYPES).map(k => `<button type="button" role="tab" data-tab="${k}" class="${k === tab ? 'active' : ''}">
          ${t(TYPES[k].tab)} <span class="badge soon">${d[k].length}</span></button>`).join('')}
      </div>
      ${pending ? renderMapping() : renderList()}`;
  }

  function renderList() {
    const T = TYPES[tab];
    const list = App.data[tab];
    const q = U.norm(query);
    const filtered = q ? list.filter(r => U.norm(Object.values(r).join(' ')).includes(q)) : list;
    const shown = filtered.slice(0, 300);
    return `
      <div class="card">
        <p class="muted small">${t(T.how)}</p>
        <div class="row">
          <button class="btn" id="mdUpload" type="button">${t('upload_file')}</button>
          <input type="file" id="mdFile" accept=".xlsx,.xls,.csv" hidden>
          <input type="search" id="mdSearch" placeholder="${t('search')}" value="${U.esc(query)}" style="min-width:220px">
          <span class="spacer"></span>
          ${list.length ? `<button class="btn danger sm" id="mdClear" type="button">${t('clear_all')}</button>` : ''}
        </div>
      </div>
      <div class="card">
        ${list.length ? `
          <p class="muted small">${t('showing', { a: shown.length, b: filtered.length })}</p>
          <div class="table-wrap"><table>
            <thead><tr>${T.fields.map(f => `<th>${t(f.label)}</th>`).join('')}</tr></thead>
            <tbody>${shown.map(r => `<tr>${T.fields.map(f => `<td>${U.esc(r[f.k] || '')}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>` : `<p class="muted">${t('no_data')}</p>`}
      </div>`;
  }

  function renderMapping() {
    const T = TYPES[pending.type];
    const opts = sel => `<option value="-1">${t('not_used')}</option>` +
      pending.headers.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${U.esc(h || '#' + (i + 1))}</option>`).join('');
    const preview = pending.rows.slice(0, 8);
    return `
      <div class="card">
        <h2>${t('map_columns')}</h2>
        <p class="muted small">${t('map_hint')}</p>
        <div class="row" style="margin-bottom:14px">
          ${T.fields.map(f => `<label class="field">${t(f.label)}${f.req ? ' *' : ''}
            <select data-map="${f.k}">${opts(pending.map[f.k])}</select></label>`).join('')}
        </div>
        <h3>${t('preview')} (${pending.rows.length})</h3>
        <div class="table-wrap" style="margin-bottom:14px"><table>
          <thead><tr>${T.fields.map(f => `<th>${t(f.label)}</th>`).join('')}</tr></thead>
          <tbody>${preview.map(r => `<tr>${T.fields.map(f => `<td>${U.esc(pending.map[f.k] >= 0 ? r[pending.map[f.k]] : '')}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="row">
          <button class="btn" id="mdSave" type="button">${t('save')}</button>
          <button class="btn ghost" id="mdCancel" type="button">${t('cancel')}</button>
        </div>
      </div>`;
  }

  async function onFile(file) {
    try {
      const rows = (await U.readSheet(file)).filter(r => r.some(c => c));
      const hi = rows.findIndex(r => r.filter(c => c).length >= 2);
      const headerIdx = hi < 0 ? 0 : hi;
      const headers = rows[headerIdx] || [];
      pending = { type: tab, headers, rows: rows.slice(headerIdx + 1), map: autoMap(tab, headers) };
      App.rerender();
    } catch (e) { U.toast(t('error', { e: e.message })); }
  }

  async function save() {
    const T = TYPES[pending.type];
    const missing = T.fields.filter(f => f.req && pending.map[f.k] < 0).map(f => t(f.label));
    if (missing.length) { U.toast(t('required_missing', { f: missing.join(', ') })); return; }
    const out = [];
    for (const r of pending.rows) {
      const o = {};
      for (const f of T.fields) o[f.k] = pending.map[f.k] >= 0 ? (r[pending.map[f.k]] || '').trim() : '';
      if (T.fields.filter(f => f.req).every(f => o[f.k])) out.push(o);
    }
    if (pending.type === 'accounts') out.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    await App.saveData(pending.type, out);
    pending = null;
    U.toast(t('saved_n', { n: out.length }));
    App.rerender();
  }

  function mount(root) {
    root.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      tab = b.dataset.tab; pending = null; query = ''; App.rerender();
    }));
    if (pending) {
      root.querySelectorAll('[data-map]').forEach(s => s.addEventListener('change', () => {
        pending.map[s.dataset.map] = +s.value; App.rerender();
      }));
      root.querySelector('#mdSave').addEventListener('click', save);
      root.querySelector('#mdCancel').addEventListener('click', () => { pending = null; App.rerender(); });
      return;
    }
    const file = root.querySelector('#mdFile');
    root.querySelector('#mdUpload').addEventListener('click', () => file.click());
    file.addEventListener('change', () => { if (file.files[0]) onFile(file.files[0]); });
    const search = root.querySelector('#mdSearch');
    search.addEventListener('input', () => {
      query = search.value;
      const pos = search.selectionStart;
      App.rerender();
      const s2 = document.getElementById('mdSearch');
      s2.focus(); s2.setSelectionRange(pos, pos);
    });
    const clear = root.querySelector('#mdClear');
    if (clear) clear.addEventListener('click', async () => {
      if (!(await U.ask({ message: t('confirm_clear', { what: t(TYPES[tab].tab) }), okText: t('clear_all'), danger: true }))) return;
      await App.saveData(tab, []);
      App.rerender();
    });
  }

  function reset() { pending = null; query = ''; }

  return { render, mount, reset };
})();

</script>
<script>
/* Bank Statement → Odoo import file (Date, Label, Partner, Amount, Cumulative balance). */
const Bank = (() => {
  const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const ROLES = ['date', 'label', 'ref', 'partner', 'debit', 'credit', 'amount', 'balance', 'ignore'];
  const OUT_HEADERS = ['Date', 'Label', 'Partner', 'Amount', 'Cumulative balance'];

  // Header keywords, checked in this order (first match wins).
  const KW = [
    ['date', /\bdate\b|تاريخ/i],
    ['balance', /balance|رصيد/i],
    ['debit', /debit|withdraw|paid out|money out|^dr\.?$|مدين|سحب|مسحوب|خصم/i],
    ['credit', /credit|deposit|paid in|money in|^cr\.?$|دائن|إيداع|ايداع/i],
    ['amount', /^amount\b|^المبلغ|^مبلغ/i],
    ['ref', /ref|cheque|chq|check no|المرجع|مرجع|شيك/i],
    ['label', /descr|detail|narrat|particular|transaction|remark|memo|البيان|بيان|الوصف|التفاصيل|تفاصيل|شرح/i],
    ['partner', /beneficiary|counterparty|payee|partner|المستفيد|الطرف/i],
  ];
  const TOTAL_RE = /^\s*(grand\s+)?(total|sub-?total|closing balance|number of|الإجمالي|إجمالي|اجمالي|المجموع|مجموع|عدد)/i;
  const OPENING_RE =/opening|brought forward|b\/f|previous balance|balance forward|رصيد افتتاحي|الرصيد الافتتاحي|الرصيد السابق|رصيد سابق|رصيد أول/i;

  let settings = { dateOrder: 'DMY', debitPositive: true, outDate: 'YYYY-MM-DD' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('oh_bank_settings') || '{}')); } catch (e) { /* ignore */ }
  const saveSettings = () => { try { localStorage.setItem('oh_bank_settings', JSON.stringify(settings)); } catch (e) { /* ignore */ } };

  // State
  let st = { status: 'idle', fileName: '', error: '', raw: null, roles: [], rows: [], info: {} };

  /* ---------- Reading ---------- */
  function roleOf(text) {
    const s = (text || '').trim();
    if (!s || s.length > 40) return null;
    for (const [role, re] of KW) if (re.test(s)) return role;
    return null;
  }
  function isHeaderCells(strs) {
    if (strs.some(s => U.parseDate(s) || U.parseNum(s))) return false;
    const roles = new Set(strs.map(roleOf).filter(Boolean));
    return roles.size >= 3 || (roles.size >= 2 && roles.has('date'));
  }

  // Money amounts that may be glued to neighbouring text, e.g. "INTERNAAED200,000.00".
  const CUR = '(?:AED|USD|EUR|GBP|SAR|KWD|QAR|BHD|OMR|EGP|JOD|INR)';
  const MONEY_RE = new RegExp(CUR + '\\s?-?\\d[\\d,]*\\.\\d{1,3}|-?\\d{1,3}(?:,\\d{3})+\\.\\d{1,3}', 'g');
  const IS_MONEY = new RegExp('^\\s*' + CUR + '?\\s?[-(]?\\d[\\d,]*\\.\\d{1,3}\\)?-?\\s*(CR|DR)?\\s*$', 'i');

  // Decimal places of the statement's currency (2 for AED/SAR/USD, 3 for KWD/BHD/OMR/JOD). Detected per file.
  let DEC = 2;
  const rnd = v => { const f = Math.pow(10, DEC); return Math.round(v * f) / f; };
  const TOL = () => Math.pow(10, -DEC) * 0.6;
  const fx = v => Number(v).toFixed(DEC);
  const money = v => (v == null || isNaN(v) ? '' : Number(v).toLocaleString('en-US', { minimumFractionDigits: DEC, maximumFractionDigits: DEC }));

  /* Most common number of decimals among amount cells (wrapped fragments are ignored by taking the mode). */
  function detectDecimals(rows, idx) {
    const count = {};
    for (const r of rows) for (const i of idx) {
      const m = U.digits(r.cells[i] || '').match(/[.,](\d{2,3})\)?-?\s*(CR|DR)?\.?\s*$/i);
      if (m && /\d/.test(r.cells[i]) && !/[\/:]/.test(r.cells[i])) count[m[1].length] = (count[m[1].length] || 0) + 1;
    }
    return (count[3] || 0) > (count[2] || 0) ? 3 : 2;
  }

  /* Split one PDF text item into text / money pieces, estimating each piece's x position. */
  function splitItem(it) {
    const s = it.str, parts = [];
    let last = 0;
    for (const m of s.matchAll(MONEY_RE)) {
      if (m.index > last) parts.push([last, m.index, false]);
      parts.push([m.index, m.index + m[0].length, true]);
      last = m.index + m[0].length;
    }
    if (last < s.length) parts.push([last, s.length, false]);
    if (parts.length <= 1) return [{ ...it, money: IS_MONEY.test(s) }];
    const cw = it.w / Math.max(s.length, 1);
    return parts
      .map(([a, b, money]) => ({ ...it, str: s.slice(a, b), x: it.x + a * cw, w: (b - a) * cw, money: money || IS_MONEY.test(s.slice(a, b)) }))
      .filter(p => p.str.trim());
  }

  function mergeCells(items) {
    const cells = [];
    for (const it of items) {
      const last = cells[cells.length - 1];
      const gap = last ? it.x - last.x1 : Infinity;
      const fs = Math.max(it.h, 4);
      if (last && gap < fs * 0.9 && !it.money && !last.money) {
        last.str += (gap > fs * 0.12 ? ' ' : '') + it.str;
        last.x1 = Math.max(last.x1, it.x + it.w);
      } else cells.push({ str: it.str, x0: it.x, x1: it.x + it.w, money: it.money });
    }
    cells.forEach(c => { c.str = c.str.replace(/\s+/g, ' ').trim(); });
    return cells.filter(c => c.str);
  }

  async function pdfLines(buf) {
    if (!window.pdfjsLib) throw new Error(t('pdf_lib_missing'));
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const lines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      const items = tc.items.filter(i => i.str && i.str.trim()).flatMap(i => splitItem({
        str: i.str, x: i.transform[4], y: vp.height - i.transform[5], w: i.width,
        h: Math.abs(i.transform[3]) || i.height || 8,
      }));
      items.sort((a, b) => a.y - b.y || a.x - b.x);
      const pageLines = [];
      for (const it of items) {
        const L = pageLines.find(l => Math.abs(l.y - it.y) <= Math.max(2, Math.min(l.h, it.h) * 0.45));
        if (L) { L.items.push(it); L.h = Math.max(L.h, it.h); }
        else pageLines.push({ y: it.y, h: it.h, items: [it], page: p });
      }
      for (const L of pageLines) { L.items.sort((a, b) => a.x - b.x); L.cells = mergeCells(L.items); }
      pageLines.sort((a, b) => a.y - b.y);
      lines.push(...pageLines.filter(l => l.cells.length));
    }
    return lines;
  }

  function spansFrom(cols) {
    cols.sort((a, b) => a.x0 - b.x0);
    cols.forEach((c, i) => {
      c.l = i === 0 ? -Infinity : (cols[i - 1].x1 + c.x0) / 2;
      c.r = i === cols.length - 1 ? Infinity : (c.x1 + cols[i + 1].x0) / 2;
    });
    return cols;
  }

  function clusterColumns(lines) {
    const dateLines = lines.filter(l => l.cells.length >= 2 && U.parseDate(l.cells[0].str, settings.dateOrder));
    const iv = dateLines.flatMap(l => l.cells.map(c => [c.x0, c.x1])).sort((a, b) => a[0] - b[0]);
    const cols = [];
    for (const [a, b] of iv) {
      const last = cols[cols.length - 1];
      if (last && a <= last.x1 + 1) last.x1 = Math.max(last.x1, b);
      else cols.push({ x0: a, x1: b, header: '' });
    }
    return spansFrom(cols);
  }

  function linesToRaw(lines) {
    const hi = lines.findIndex(l => isHeaderCells(l.cells.map(c => c.str)));
    let cols, startIdx = 0;
    const headerTexts = new Set();
    if (hi >= 0) {
      // Headers can sit on two lines ("Transaction" above, "Date" below): merge nearby header lines.
      const H = lines[hi], hh = H.h || 8;
      const hdr = H.cells.map(c => ({ x0: c.x0, x1: c.x1, header: c.str }));
      let last = hi;
      headerTexts.add(H.cells.map(c => c.str).join('|'));
      for (let j = Math.max(0, hi - 2); j <= Math.min(lines.length - 1, hi + 2); j++) {
        const L = lines[j];
        if (j === hi || L.page !== H.page || Math.abs(L.y - H.y) > hh * 1.3) continue;
        if (L.cells.some(c => U.parseDate(c.str) || U.parseNum(c.str))) continue;   // a data line, not a header
        for (const c of L.cells) {
          const col = hdr.find(h => c.x0 < h.x1 && c.x1 > h.x0);
          if (col) {
            col.header = L.y < H.y ? c.str + ' ' + col.header : col.header + ' ' + c.str;
            col.x0 = Math.min(col.x0, c.x0); col.x1 = Math.max(col.x1, c.x1);
          } else hdr.push({ x0: c.x0, x1: c.x1, header: c.str });
        }
        headerTexts.add(L.cells.map(c => c.str).join('|'));
        last = Math.max(last, j);
      }
      cols = spansFrom(hdr);
      startIdx = last + 1;
    } else {
      cols = clusterColumns(lines);
    }
    const rows = [];
    for (let i = startIdx; i < lines.length; i++) {
      const L = lines[i];
      if (headerTexts.has(L.cells.map(c => c.str).join('|'))) continue; // repeated header on later pages
      // Place each piece by where it starts (text) or ends (right-aligned amounts),
      // so text overflowing into the next column stays in its own column.
      const cells = cols.map(() => '');
      const ends = cols.map(() => -Infinity);
      const colAt = x => { const k = cols.findIndex(col => x >= col.l && x < col.r); return k < 0 ? 0 : k; };
      for (const it of L.items) {
        let k = colAt(it.x + 0.5);
        if (it.money) {
          // Amounts may be left- or right-aligned: pick the column they line up with best.
          const k1 = colAt(it.x + it.w - 0.5);
          if (k1 !== k) {
            const fit = c => Math.min(Math.abs(it.x - cols[c].x0), Math.abs(it.x + it.w - cols[c].x1));
            if (fit(k1) < fit(k)) k = k1;
          }
        }
        const str = it.str.trim();
        const tight = it.x - ends[k] < Math.max(it.h, 4) * 0.12;
        cells[k] = !cells[k] ? str : cells[k] + (tight ? '' : ' ') + str;
        ends[k] = it.x + it.w;
      }
      rows.push({ cells, page: L.page, y: L.y, h: L.h });
    }
    return { cols: cols.map(c => ({ header: c.header })), rows, hasHeader: hi >= 0 };
  }

  function sheetToRaw(aoa) {
    const rows = aoa.filter(r => r.some(c => c));
    const hi = rows.findIndex(r => isHeaderCells(r.filter(c => c)));
    const width = Math.max(...rows.map(r => r.length));
    const pad = r => Array.from({ length: width }, (_, i) => r[i] || '');
    const header = hi >= 0 ? pad(rows[hi]) : Array(width).fill('');
    return {
      cols: header.map(h => ({ header: h })),
      rows: rows.slice(hi + 1).map(r => ({ cells: pad(r) })),
      hasHeader: hi >= 0,
    };
  }

  /* ---------- Column roles ---------- */
  function autoRoles(raw) {
    const n = raw.cols.length;
    const roles = Array(n).fill('ignore');
    const seen = new Set();
    raw.cols.forEach((c, i) => {
      const r = roleOf(c.header);
      if (r && !seen.has(r)) { roles[i] = r; seen.add(r); }
      else if (r === 'label' || r === 'ref') roles[i] = 'ref';   // extra description columns ("Details") go into the label
    });
    const sample = raw.rows.slice(0, 400);
    const stats = raw.cols.map((_, i) => {
      let nonEmpty = 0, dates = 0, nums = 0, len = 0;
      for (const r of sample) {
        const v = r.cells[i]; if (!v) continue;
        nonEmpty++; len += v.length;
        if (U.parseDate(v, settings.dateOrder)) dates++;
        else if (U.parseNum(v)) nums++;
      }
      return { nonEmpty, dates, nums, avgLen: nonEmpty ? len / nonEmpty : 0 };
    });
    if (!seen.has('date')) {
      let best = -1, bestScore = 0;
      stats.forEach((s, i) => { if (roles[i] === 'ignore' && s.dates > bestScore) { best = i; bestScore = s.dates; } });
      if (best >= 0) { roles[best] = 'date'; seen.add('date'); }
    }
    const hasAmounts = ['debit', 'credit', 'amount'].some(r => seen.has(r));
    if (!hasAmounts || !seen.has('balance')) {
      const numeric = stats.map((s, i) => ({ i, s }))
        .filter(({ i, s }) => roles[i] === 'ignore' && s.nonEmpty >= 2 && s.nums / s.nonEmpty > 0.7)
        .map(o => o.i);
      if (!seen.has('balance') && numeric.length && (numeric.length > 1 || hasAmounts)) {
        roles[numeric.pop()] = 'balance'; seen.add('balance');
      }
      if (!hasAmounts) {
        if (numeric.length >= 2) { roles[numeric[numeric.length - 2]] = 'debit'; roles[numeric[numeric.length - 1]] = 'credit'; }
        else if (numeric.length === 1) roles[numeric[0]] = 'amount';
      }
    }
    if (!seen.has('label')) {
      let best = -1, bestLen = 0;
      stats.forEach((s, i) => { if (roles[i] === 'ignore' && s.avgLen > bestLen && s.nums < s.nonEmpty / 2) { best = i; bestLen = s.avgLen; } });
      if (best >= 0) roles[best] = 'label';
    }
    return roles;
  }

  /* ---------- Building transactions ---------- */
  function prepContacts() {
    return App.data.contacts
      .map(c => ({ name: c.name, n: U.norm(c.name) }))
      .filter(c => c.n.length >= 3)
      .sort((a, b) => b.n.length - a.n.length);
  }
  function matchPartner(label, prepared) {
    const nl = ' ' + U.norm(label) + ' ';
    for (const p of prepared) if (nl.includes(' ' + p.n + ' ')) return p.name;
    return '';
  }

  function runCheck(list, opening) {
    let ok = 0, bad = 0, prev = opening;
    for (const x of list) {
      if (prev != null && x.balance != null) {
        if (Math.abs(prev + x.amount - x.balance) < TOL()) ok++; else bad++;
      }
      prev = x.balance != null ? x.balance : (prev != null ? prev + x.amount : null);
    }
    return { ok, bad };
  }

  function build() {
    const raw = st.raw, roles = st.roles;
    const at = r => roles.indexOf(r);
    const all = r => roles.map((x, i) => (x === r ? i : -1)).filter(i => i >= 0);
    const di = at('date'), debI = at('debit'), creI = at('credit'), amtI = at('amount'), balI = at('balance'), parI = at('partner');
    const labelIdx = all('label'), refIdx = all('ref');
    const numIdx = [debI, creI, amtI, balI].filter(i => i >= 0);
    const NUMK = [['deb', debI], ['cre', creI], ['amt', amtI], ['bal', balI]];
    DEC = detectDecimals(raw.rows, numIdx);
    const COMPLETE = new RegExp('[.,]\\d{' + DEC + '}\\)?-?\\s*(CR|DR)?\\.?$', 'i');   // amount string that is not cut off
    const joinTxt = (a, b) => (!a ? b : (a.endsWith('-') || b.startsWith('-') ? a + b : a + ' ' + b));
    let opening = null;
    const dateOf = row => U.parseDate(row.cells[di], settings.dateOrder);
    const hasContent = row => row.cells.some(v => v && v.trim());
    // Summary lines ("Total Debit Amount", "إجمالي", …) or non-date text in the Date column are not transaction lines.
    const isSummary = row => {
      const c = row.cells;
      return c.some((v, i) => !labelIdx.includes(i) && TOTAL_RE.test(v || '')) || (!!(c[di] || '').trim() && !dateOf(row));
    };
    const tryOpening = row => {
      if (!groups.length && balI >= 0 && OPENING_RE.test(row.cells.join(' ')) && U.parseNum(row.cells[balI])) {
        opening = U.parseNum(row.cells[balI]).v; return true;
      }
      return false;
    };

    // 1) Group lines into transactions: { date, dateRow, rows (in reading order) }.
    const groups = [];
    if (di >= 0 && raw.rows.some(r => r.y != null)) {
      // PDF: split lines into visual blocks by vertical spacing. A block's lines belong to its date line,
      // including lines printed ABOVE it (descriptions centred on the row). Blocks without a date continue
      // the previous transaction when close enough (text wrapped onto following lines).
      const blocks = [];
      let blk = null, prev = null, intraMax = 0, interMin = Infinity;
      for (const row of raw.rows) {
        if (!hasContent(row)) continue;
        if (tryOpening(row) || isSummary(row)) { blk = null; prev = null; continue; }
        const gap = prev && row.page === prev.page ? row.y - prev.y : Infinity;
        const gapLimit = 1.4 * Math.max(row.h || 8, (prev && prev.h) || 8);
        if (!blk || gap > gapLimit) { blk = []; blocks.push(blk); if (gap < Infinity) interMin = Math.min(interMin, gap); }
        else intraMax = Math.max(intraMax, gap);
        blk.push(row); prev = row;
      }
      // Use blocks only when the layout clearly has them: one date per block and gaps between
      // transactions well above the gaps inside them. Otherwise lines are evenly spaced, and
      // wrapped lines always belong to the transaction above.
      const oneDate = blocks.filter(b => b.filter(r => dateOf(r)).length === 1).length;
      const centred = blocks.length > 1 && oneDate >= 0.8 * blocks.length && interMin >= Math.max(intraMax, 1) * 1.5;
      if (!centred) {
        const flat = blocks.flat();
        blocks.length = 0;
        for (const r of flat) {
          const p = blocks.length ? blocks[blocks.length - 1] : null;
          const last = p && p[p.length - 1];
          if (dateOf(r) || !p || last.page !== r.page || r.y - last.y > (r.h || 10) * 2.6) blocks.push([r]);
          else p.push(r);
        }
      }
      for (const b of blocks) {
        const first = b.findIndex(r => dateOf(r));
        if (first < 0) {
          const g = groups[groups.length - 1];
          if (g && g.page === b[0].page && b[0].y - g.lastY <= (b[0].h || 10) * 2.6) { g.rows.push(...b); g.lastY = b[b.length - 1].y; }
          continue;
        }
        let g = null;
        b.forEach((r, i) => {
          const d = dateOf(r);
          if (d) {
            g = { date: d, dateRow: r, rows: i === first ? b.slice(0, first).concat(r) : [r], page: r.page, lastY: r.y };
            groups.push(g);
          } else if (i > first) { g.rows.push(r); g.lastY = r.y; }
        });
      }
    } else if (di >= 0) {
      // Excel / CSV: one row per transaction, plus following rows that only carry extra text.
      let g = null;
      for (const row of raw.rows) {
        if (!hasContent(row)) continue;
        if (tryOpening(row) || isSummary(row)) { g = null; continue; }
        const d = dateOf(row);
        if (d) { g = { date: d, dateRow: row, rows: [row] }; groups.push(g); }
        else if (g && !numIdx.some(i => row.cells[i] && COMPLETE.test(row.cells[i].trim()))) g.rows.push(row);
        else g = null;
      }
    }

    // 2) Fold each group's lines into one transaction.
    const found = groups.map(g => {
      const f = { date: g.date, label: '', ref: '', partner: '', raw: {} };
      for (const [k, i] of NUMK) f.raw[k] = i >= 0 ? (g.dateRow.cells[i] || '').trim() : '';
      let after = false;
      for (const r of g.rows) {
        const c = r.cells;
        const text = labelIdx.map(i => c[i]).filter(Boolean).join(' ').trim();
        const refTxt = refIdx.map(i => c[i]).filter(Boolean).join(' ').trim();
        if (text) f.label = (f.label + ' ' + text).trim();
        if (refTxt) f.ref = joinTxt(f.ref, refTxt);
        if (parI >= 0 && c[parI]) f.partner = (f.partner + ' ' + c[parI]).trim();
        if (r === g.dateRow) { after = true; continue; }
        // Finish amounts cut across lines (e.g. "7,933,493.0" + "6").
        if (after) for (const [k, i] of NUMK) {
          const v = i >= 0 ? (c[i] || '').trim() : '';
          if (v && f.raw[k] && !COMPLETE.test(f.raw[k]) && /^[\d.,]+\)?-?$/.test(v)) f.raw[k] += v;
        }
      }
      return f;
    });

    // Turn raw strings into signed amounts.
    const txs = [];
    for (const f of found) {
      const deb = U.parseNum(f.raw.deb), cre = U.parseNum(f.raw.cre), amt = U.parseNum(f.raw.amt), bal = U.parseNum(f.raw.bal);
      let amount = null;
      if ((deb && deb.v) || (cre && cre.v)) {
        const d = deb ? Math.abs(deb.v) : 0, cr = cre ? Math.abs(cre.v) : 0;
        amount = settings.debitPositive ? d - cr : cr - d;
      } else if (amt && amt.v) {
        let v = amt.v;
        if (amt.sfx === 'D') v = Math.abs(v) * (settings.debitPositive ? 1 : -1);
        else if (amt.sfx === 'C') v = Math.abs(v) * (settings.debitPositive ? -1 : 1);
        amount = v;
      }
      if (amount == null) {
        if (bal && !txs.length && opening == null) opening = bal.v;
        continue;
      }
      txs.push({ ...f, amount: rnd(amount), balance: bal ? rnd(bal.v) : null });
    }

    // Order: oldest first.
    let reversed = false;
    if (txs.length > 1) {
      const firstD = txs[0].date, lastD = txs[txs.length - 1].date;
      const fwd = runCheck(txs, opening), rev = runCheck([...txs].reverse(), null);
      if (firstD > lastD || (firstD === lastD && rev.ok > fwd.ok)) { txs.reverse(); reversed = true; }
    }

    // Sign check against running balance.
    const hasBalance = txs.some(x => x.balance != null);
    const op = reversed ? null : opening;
    const chk = runCheck(txs, op);
    const flipped = runCheck(txs.map(x => ({ ...x, amount: -x.amount })), op);
    const suggestFlip = hasBalance && chk.bad > 0 && flipped.ok > chk.ok && flipped.bad < chk.bad;

    // Fill missing balances, mark mismatches, match partners.
    const prepared = prepContacts();
    let prev = op, partnersFound = 0;
    st.rows = txs.map((x, i) => {
      let mismatch = false, balance = x.balance;
      if (prev != null && balance != null) mismatch = Math.abs(prev + x.amount - balance) >= TOL();
      if (balance == null && prev != null) balance = rnd(prev + x.amount);
      prev = balance;
      const one = s => (s || '').replace(/\s+/g, ' ').trim();   // single line: no line breaks or long space runs
      const lbl = one(x.label), ref = one(x.ref);
      const label = (lbl + (ref && ref !== lbl && !lbl.includes(ref) ? ' - ' + ref : '')).trim();
      let partner = x.partner || '';
      if (!partner && prepared.length) partner = matchPartner(label, prepared);
      if (partner) partnersFound++;
      return { id: i + 1, date: x.date, label, partner, amount: x.amount, balance, mismatch };
    });
    if (reversed && opening == null && st.rows.length && st.rows[0].balance != null) {
      opening = rnd(st.rows[0].balance - st.rows[0].amount);
    }
    st.info = { opening, reversed, hasBalance, mismatches: st.rows.filter(r => r.mismatch).length, suggestFlip, partnersFound };
  }

  async function onFiles(files) {
    const file = files[0];
    st = { status: 'busy', fileName: file.name, error: '', raw: null, roles: [], rows: [], info: {} };
    App.rerender();
    try {
      if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
        const lines = await pdfLines(await U.readFile(file));
        if (!lines.length) throw new Error(t('no_text'));
        st.raw = linesToRaw(lines);
      } else {
        st.raw = sheetToRaw(await U.readSheet(file));
      }
      st.roles = autoRoles(st.raw);
      build();
      st.status = 'done';
      if (!st.rows.length) st.error = t('no_rows');
    } catch (e) {
      console.error(e);
      st.status = 'done';
      st.error = e.message && (e.message === t('no_text') || e.message === t('pdf_lib_missing')) ? e.message : t('error', { e: e.message || e });
    }
    App.rerender();
  }

  /* ---------- Export ---------- */
  function aoa(forCsv) {
    return [OUT_HEADERS, ...st.rows.map(r => [
      U.fmtDate(r.date, settings.outDate), r.label, r.partner,
      forCsv ? fx(r.amount) : r.amount,
      r.balance == null ? '' : (forCsv ? fx(r.balance) : r.balance),
    ])];
  }
  function fileBase() {
    const first = st.rows[0], last = st.rows[st.rows.length - 1];
    return `${U.safeName(App.company().name)}_bank_statement_${first ? first.date : ''}_${last ? last.date : ''}`;
  }

  /* ---------- Rendering ---------- */
  function renderSettings() {
    const o = (v, cur, label) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${label}</option>`;
    return `
      <div class="row" style="margin-top:14px">
        <label class="field">${t('date_order')}
          <select data-set="dateOrder">${o('DMY', settings.dateOrder, 'DD/MM/YYYY')}${o('MDY', settings.dateOrder, 'MM/DD/YYYY')}</select></label>
        <label class="field">${t('sign_rule')}
          <select data-set="debitPositive">${o('1', settings.debitPositive ? '1' : '0', t('sign_debit_pos'))}${o('0', settings.debitPositive ? '1' : '0', t('sign_credit_pos'))}</select></label>
        <label class="field">${t('out_date')}
          <select data-set="outDate">${['YYYY-MM-DD', 'DD/MM/YYYY', 'MM/DD/YYYY'].map(f => o(f, settings.outDate, f)).join('')}</select></label>
      </div>`;
  }

  function renderSummary() {
    const rows = st.rows, info = st.info;
    if (!rows.length) return '';
    const pos = rows.filter(r => r.amount > 0).reduce((s, r) => s + r.amount, 0);
    const neg = rows.filter(r => r.amount < 0).reduce((s, r) => s + r.amount, 0);
    const mism = rows.filter(r => r.mismatch).length;
    const last = rows[rows.length - 1];
    let check;
    if (!info.hasBalance) check = `<div class="notice warn">${t('check_none')}</div>`;
    else if (!mism) check = `<div class="notice ok">✓ ${t('check_ok')}</div>`;
    else check = `<div class="notice warn">⚠ ${t('check_bad', { n: mism })}</div>`;
    return `
      ${check}
      ${info.suggestFlip ? `<div class="notice warn">${t('check_flip')} <button class="btn sm" id="bkFlip" type="button">${t('flip_now')}</button></div>` : ''}
      ${info.reversed ? `<div class="notice info">${t('reversed_note')}</div>` : ''}
      ${App.data.contacts.length
        ? `<div class="notice info">${t('partners_found', { n: rows.filter(r => r.partner).length, m: rows.length })}</div>`
        : `<div class="notice info">${t('no_contacts_hint')}</div>`}
      <div class="stats">
        <div class="stat"><b>${rows.length}</b><span>${t('rows')}</span></div>
        <div class="stat"><b class="pos">${money(pos)}</b><span>${t('total_pos')}</span></div>
        <div class="stat"><b class="neg">${money(neg)}</b><span>${t('total_neg')}</span></div>
        ${info.opening != null ? `<div class="stat"><b>${money(info.opening)}</b><span>${t('opening')}</span></div>` : ''}
        ${last.balance != null ? `<div class="stat"><b>${money(last.balance)}</b><span>${t('closing')}</span></div>` : ''}
      </div>`;
  }

  function renderTable() {
    return `
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>${t('h_date')}</th><th>${t('h_label')}</th><th>${t('h_partner')}</th>
          <th class="num">${t('h_amount')}</th><th class="num">${t('h_balance')}</th><th></th></tr></thead>
        <tbody>${st.rows.map((r, i) => `
          <tr class="${r.mismatch ? 'mismatch' : ''}" data-i="${i}">
            <td class="muted">${i + 1}</td>
            <td class="date-cell"><input data-f="date" type="date" value="${r.date}"></td>
            <td class="label-cell"><input data-f="label" dir="auto" value="${U.esc(r.label)}"></td>
            <td class="partner-cell"><input data-f="partner" dir="auto" list="bkContacts" value="${U.esc(r.partner)}"></td>
            <td class="num"><input data-f="amount" class="num ${r.amount < 0 ? 'neg' : 'pos'}" value="${fx(r.amount)}"></td>
            <td class="num"><input data-f="balance" class="num" value="${r.balance == null ? '' : fx(r.balance)}"></td>
            <td><button class="icon-btn" data-del="${i}" title="${t('remove_row')}" aria-label="${t('remove_row')}" type="button">✕</button></td>
          </tr>`).join('')}</tbody>
      </table></div>
      <datalist id="bkContacts">${App.data.contacts.slice(0, 5000).map(c => `<option value="${U.esc(c.name)}">`).join('')}</datalist>`;
  }

  function renderRaw() {
    if (!st.raw) return '';
    const raw = st.raw;
    const sample = raw.rows.slice(0, 40);
    return `
      <details class="card" id="bkRaw">
        <summary>${t('detected_cols')}</summary>
        <p class="muted small">${t('detected_hint')}</p>
        <div class="table-wrap"><table>
          <thead><tr>${raw.cols.map((c, i) => `<th>
            <select data-role="${i}">${ROLES.map(r => `<option value="${r}" ${st.roles[i] === r ? 'selected' : ''}>${t('role_' + r)}</option>`).join('')}</select>
            <div class="muted small" style="font-weight:400">${U.esc(c.header || '')}</div></th>`).join('')}</tr></thead>
          <tbody>${sample.map(r => `<tr>${r.cells.map(c => `<td>${U.esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </details>`;
  }

  function render() {
    const busy = st.status === 'busy';
    const has = st.rows.length > 0;
    return `
      <div class="page-head"><h1>${t('bank_title')}</h1><p class="muted">${t('bank_sub')}</p></div>
      <div class="card">
        ${has ? `
          <div class="row">
            <b>${U.esc(st.fileName)}</b><span class="spacer"></span>
            <button class="btn" id="bkXlsx" type="button">${t('download_xlsx')}</button>
            <button class="btn ghost" id="bkCsv" type="button">${t('download_csv')}</button>
            <button class="btn ghost" id="bkCopy" type="button">${t('copy_table')}</button>
            <button class="btn ghost" id="bkNew" type="button">${t('new_file')}</button>
          </div>` : `
          <div class="drop" id="bkDrop" tabindex="0" role="button">
            <b>${t('drop_title')}</b><span class="muted">${t('drop_sub')}</span>
          </div>`}
        <input type="file" id="bkFile" accept=".pdf,.xlsx,.xls,.csv" hidden>
        ${renderSettings()}
      </div>
      ${busy ? `<div class="card"><span class="spinner"></span> ${U.esc(t('reading', { f: st.fileName }))}</div>` : ''}
      ${st.error ? `<div class="notice bad">${U.esc(st.error)}</div>` : ''}
      ${has ? `<div class="card"><div id="bkSummary">${renderSummary()}</div>
        ${renderTable()}
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="bkAdd" type="button">+ ${t('add_row')}</button></div>
      </div>` : ''}
      ${renderRaw()}`;
  }

  function refreshSummary(root) {
    const el = root.querySelector('#bkSummary');
    if (el) { el.innerHTML = renderSummary(); wireFlip(root); }
  }
  function wireFlip(root) {
    const flip = root.querySelector('#bkFlip');
    if (flip) flip.addEventListener('click', () => {
      settings.debitPositive = !settings.debitPositive; saveSettings(); build(); App.rerender();
    });
  }

  function recalcMismatch() {
    let prev = st.info.reversed ? null : st.info.opening;
    for (const r of st.rows) {
      r.mismatch = prev != null && r.balance != null && Math.abs(prev + r.amount - r.balance) >= TOL();
      prev = r.balance != null ? r.balance : (prev != null ? prev + r.amount : null);
    }
  }

  function mount(root) {
    const file = root.querySelector('#bkFile');
    const drop = root.querySelector('#bkDrop');
    if (drop) U.dropZone(drop, file, onFiles);
    else file.addEventListener('change', () => { if (file.files.length) onFiles(file.files); file.value = ''; });

    root.querySelectorAll('[data-set]').forEach(s => s.addEventListener('change', () => {
      const k = s.dataset.set;
      settings[k] = k === 'debitPositive' ? s.value === '1' : s.value;
      saveSettings();
      if (st.raw && k !== 'outDate') build();
      App.rerender();
    }));

    const raw = root.querySelector('#bkRaw');
    if (raw) {
      if (!st.rows.length) raw.open = true;
      root.querySelectorAll('[data-role]').forEach(s => s.addEventListener('change', () => {
        st.roles[+s.dataset.role] = s.value;
        build(); st.error = st.rows.length ? '' : t('no_rows');
        App.rerender();
        const d = document.getElementById('bkRaw'); if (d) d.open = true;
      }));
    }
    if (!st.rows.length) return;

    const afterSave = res => {
      if (String(res).startsWith('unavailable')) {
        U.copyDialog({ message: t('save_failed_msg'), text: U.toTSV(aoa(true)), reason: String(res).split(':')[1] });
      }
    };
    root.querySelector('#bkXlsx').addEventListener('click', async () =>
      afterSave(await U.downloadXLSX(fileBase() + '.xlsx', aoa(false), 'Bank Statement', [12, 60, 30, 14, 18])));
    root.querySelector('#bkCsv').addEventListener('click', async () => afterSave(await U.downloadCSV(fileBase() + '.csv', aoa(true))));
    root.querySelector('#bkCopy').addEventListener('click', () => {
      const text = U.toTSV(aoa(true));
      const fail = () => U.copyDialog({ message: t('copy_manual'), text, reason: 'clipboard' });
      try { navigator.clipboard.writeText(text).then(() => U.toast(t('copied_table')), fail); } catch (e) { fail(); }
    });
    root.querySelector('#bkNew').addEventListener('click', () => {
      st = { status: 'idle', fileName: '', error: '', raw: null, roles: [], rows: [], info: {} };
      App.rerender();
    });
    root.querySelector('#bkAdd').addEventListener('click', () => {
      const last = st.rows[st.rows.length - 1];
      st.rows.push({ id: Date.now(), date: last ? last.date : new Date().toISOString().slice(0, 10), label: '', partner: '', amount: 0, balance: last ? last.balance : null, mismatch: false });
      App.rerender();
    });
    wireFlip(root);

    root.querySelectorAll('tbody input[data-f]').forEach(inp => inp.addEventListener('change', () => {
      const tr = inp.closest('tr'); const r = st.rows[+tr.dataset.i]; const f = inp.dataset.f;
      if (f === 'amount' || f === 'balance') {
        const p = U.parseNum(inp.value);
        r[f] = p ? rnd(p.v) : (f === 'amount' ? 0 : null);
        if (f === 'amount') inp.className = 'num ' + (r.amount < 0 ? 'neg' : 'pos');
      } else r[f] = inp.value;
      recalcMismatch();
      root.querySelectorAll('tbody tr').forEach(row => row.classList.toggle('mismatch', st.rows[+row.dataset.i].mismatch));
      refreshSummary(root);
    }));
    root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      st.rows.splice(+b.dataset.del, 1); recalcMismatch(); App.rerender();
    }));
  }

  // Exposed for testing.
  return { render, mount, _onFiles: onFiles, _state: () => st };
})();

</script>
<script>
/* App shell: companies, navigation, views. */
const DATA_TYPES = ['accounts', 'contacts', 'analytics'];

const App = {
  view: 'home',
  companies: [],
  companyId: null,
  data: { accounts: [], contacts: [], analytics: [] },

  company() { return this.companies.find(c => c.id === this.companyId) || this.companies[0]; },

  async init() {
    applyLang();
    this.companies = (await Store.get('companies')) || [];
    if (!this.companies.length) {
      this.companies = [{ id: U.uid(), name: t('default_company') }];
      await Store.set('companies', this.companies);
    }
    const saved = await Store.get('activeCompany');
    this.companyId = this.companies.some(c => c.id === saved) ? saved : this.companies[0].id;
    await this.loadCompanyData();

    document.getElementById('langBtn').addEventListener('click', () => {
      setLang(LANG === 'ar' ? 'en' : 'ar');
      this.renderShell(); this.rerender();
    });
    document.getElementById('companySelect').addEventListener('change', e => this.switchCompany(e.target.value));
    window.addEventListener('hashchange', () => this.go(location.hash.slice(1)));
    this.renderShell();
    this.go(location.hash.slice(1) || 'home');
  },

  async loadCompanyData() {
    for (const k of DATA_TYPES) this.data[k] = (await Store.get(`co:${this.companyId}:${k}`)) || [];
  },

  async saveData(type, rows) {
    this.data[type] = rows;
    await Store.set(`co:${this.companyId}:${type}`, rows);
  },

  async switchCompany(id) {
    this.companyId = id;
    await Store.set('activeCompany', id);
    await this.loadCompanyData();
    MasterData.reset();
    this.renderShell(); this.rerender();
  },

  async saveCompanies() { await Store.set('companies', this.companies); },

  renderShell() {
    const sel = document.getElementById('companySelect');
    sel.innerHTML = this.companies.map(c => `<option value="${c.id}" ${c.id === this.companyId ? 'selected' : ''}>${U.esc(c.name)}</option>`).join('');
    const items = [
      ['home', 'nav_home'], null,
      ['bank', 'nav_bank', true], ['bills', 'nav_bills'],
      ['recon', 'nav_recon'], ['gl', 'nav_gl'], null,
      ['master', 'nav_master', true], ['companies', 'nav_companies', true],
    ];
    document.getElementById('nav').innerHTML = items.map(it => it ? `
      <a href="#${it[0]}" class="${this.view === it[0] ? 'active' : ''}">
        <span>${t(it[1])}</span>${it[2] || it[0] === 'home' ? '' : `<span class="badge soon">${t('soon')}</span>`}
      </a>` : '<div class="sep"></div>').join('');
  },

  go(view) {
    if (!Views[view]) view = 'home';
    this.view = view;
    this.renderShell();
    this.rerender();
    window.scrollTo(0, 0);
  },

  rerender() {
    const main = document.getElementById('main');
    const v = Views[this.view];
    main.innerHTML = v.render();
    if (v.mount) v.mount(main);
  },
};

/* ---------- Views ---------- */
const Home = {
  render() {
    const co = App.company(), d = App.data;
    const f = (href, key, desc, ready, extra = '') => `
      <a class="card feature" href="#${href}">
        <div class="row"><h2 style="margin:0">${t(key)}</h2><span class="spacer"></span>
          <span class="badge ${ready ? 'ok' : 'soon'}">${t(ready ? 'ready' : 'soon')}</span></div>
        <p class="muted" style="margin:0">${t(desc)}</p>${extra}
      </a>`;
    return `
      <div class="page-head">
        <h1>${t('home_title')}</h1>
        <p class="muted">${t('home_sub')}</p>
        <p><b>${U.esc(t('home_active', { name: co.name }))}</b> ·
          <span class="muted">${t('accounts_n', { n: d.accounts.length })} · ${t('contacts_n', { n: d.contacts.length })} · ${t('analytics_n', { n: d.analytics.length })}</span></p>
      </div>
      <div class="grid">
        ${f('bank', 'nav_bank', 'f_bank', true)}
        ${f('master', 'nav_master', 'f_master', true)}
        ${f('companies', 'nav_companies', 'f_companies', true)}
        ${f('bills', 'nav_bills', 'f_bills', false)}
        ${f('recon', 'nav_recon', 'f_recon', false)}
        ${f('gl', 'nav_gl', 'f_gl', false)}
      </div>`;
  },
};

const Companies = {
  render() {
    return `
      <div class="page-head"><h1>${t('companies_title')}</h1><p class="muted">${t('companies_sub')}</p></div>
      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <input id="coName" placeholder="${t('company_name')}" style="min-width:240px">
          <button class="btn" id="coAdd" type="button">${t('add_company')}</button>
        </div>
        ${App.companies.map(c => `
          <div class="list-item">
            <b>${U.esc(c.name)}</b>
            ${c.id === App.companyId ? `<span class="badge ok">${t('active')}</span>` : ''}
            <span class="spacer"></span>
            ${c.id !== App.companyId ? `<button class="btn ghost sm" data-act="use" data-id="${c.id}" type="button">${t('make_active')}</button>` : ''}
            <button class="btn ghost sm" data-act="rename" data-id="${c.id}" type="button">${t('rename')}</button>
            <button class="btn danger sm" data-act="delete" data-id="${c.id}" type="button">${t('delete')}</button>
          </div>`).join('')}
      </div>
      <div class="card">
        <h2>${t('backup_title')}</h2>
        <p class="muted">${t('backup_sub')}</p>
        <div class="row">
          <button class="btn ghost" id="bkExport" type="button">${t('export_backup')}</button>
          <button class="btn ghost" id="bkImport" type="button">${t('import_backup')}</button>
          <input type="file" id="bkFile" accept=".json" hidden>
        </div>
      </div>`;
  },
  mount(root) {
    const name = root.querySelector('#coName');
    const add = async () => {
      const n = name.value.trim(); if (!n) { name.focus(); return; }
      const c = { id: U.uid(), name: n };
      App.companies.push(c);
      await App.saveCompanies();
      await App.switchCompany(c.id);
    };
    root.querySelector('#coAdd').addEventListener('click', add);
    name.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

    root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
      const c = App.companies.find(x => x.id === b.dataset.id);
      if (b.dataset.act === 'use') return App.switchCompany(c.id);
      if (b.dataset.act === 'rename') {
        const n = await U.ask({ message: t('company_name'), input: c.name, okText: t('save') });
        if (n) { c.name = n; await App.saveCompanies(); App.renderShell(); App.rerender(); }
        return;
      }
      if (App.companies.length === 1) { U.toast(t('cant_delete_last')); return; }
      if (!(await U.ask({ message: t('confirm_delete_company', { name: c.name }), okText: t('delete'), danger: true }))) return;
      App.companies = App.companies.filter(x => x.id !== c.id);
      for (const k of DATA_TYPES) await Store.del(`co:${c.id}:${k}`);
      await App.saveCompanies();
      await App.switchCompany(c.id === App.companyId ? App.companies[0].id : App.companyId);
    }));

    root.querySelector('#bkExport').addEventListener('click', async () => {
      const out = { app: 'odoo-helper', version: 1, exported: new Date().toISOString(), companies: [] };
      for (const c of App.companies) {
        const e = { name: c.name };
        for (const k of DATA_TYPES) e[k] = (await Store.get(`co:${c.id}:${k}`)) || [];
        out.companies.push(e);
      }
      const json = JSON.stringify(out);
      const res = await U.download(`odoo-helper-backup-${new Date().toISOString().slice(0, 10)}.json`, json);
      if (String(res).startsWith('unavailable')) {
        U.copyDialog({ message: t('backup_copy_msg'), text: json, reason: String(res).split(':')[1] });
      }
    });
    const file = root.querySelector('#bkFile');
    root.querySelector('#bkImport').addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      try {
        const data = JSON.parse(new TextDecoder().decode(await U.readFile(file.files[0])));
        if (data.app !== 'odoo-helper' || !Array.isArray(data.companies)) throw new Error(t('bad_backup'));
        for (const e of data.companies) {
          const c = { id: U.uid(), name: String(e.name || t('default_company')) };
          App.companies.push(c);
          for (const k of DATA_TYPES) await Store.set(`co:${c.id}:${k}`, Array.isArray(e[k]) ? e[k] : []);
        }
        await App.saveCompanies();
        U.toast(t('imported_companies', { n: data.companies.length }));
        App.renderShell(); App.rerender();
      } catch (err) { U.toast(err.message === t('bad_backup') ? err.message : t('bad_backup')); }
      file.value = '';
    });
  },
};

const comingSoon = (titleKey, descKey) => ({
  render: () => `
    <div class="page-head"><h1>${t(titleKey)}</h1></div>
    <div class="card"><span class="badge soon">${t('soon')}</span>
      <h2 style="margin-top:10px">${t('soon_title')}</h2><p class="muted">${t(descKey)}</p></div>`,
});

const Views = {
  home: Home,
  bank: Bank,
  master: MasterData,
  companies: Companies,
  bills: comingSoon('nav_bills', 'soon_bills'),
  recon: comingSoon('nav_recon', 'soon_recon'),
  gl: comingSoon('nav_gl', 'soon_gl'),
};

App.init();

</script>
</body>
</html>
